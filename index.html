<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DELTA Network</title>
  <script src="https://unpkg.com/@tonconnect/ui@latest"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }
    #balance {
      font-size: 2rem;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }
    button.tap-button {
      background-color: black;
      border: 3px solid white;
      color: white;
      font-size: 5rem;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      cursor: pointer;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    }
    button.tap-button:active {
      background-color: white;
      color: black;
      transform: scale(0.93);
    }
    #ton-connect {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div id="balance">DELTA: 0.000</div>
    <button class="tap-button">&#x2206;</button>
    <div id="ton-connect"></div>
  </div>

  <script>
    // --- Elements ---
    const button = document.querySelector('.tap-button');
    const balanceDisplay = document.getElementById('balance');

    // --- Balance setup ---
    let balance = 0;
    const saved = localStorage.getItem('delta_balance');
    if (saved && !isNaN(parseFloat(saved))) {
      balance = parseFloat(saved);
    }

    // --- Display function ---
    function updateBalanceDisplay() {
      balanceDisplay.textContent = `DELTA: ${balance.toFixed(3)}`;
    }

    updateBalanceDisplay();

    // --- On click increment ---
    button.addEventListener('click', () => {
      balance += 0.1;
      updateBalanceDisplay();
    });

    // --- Keyboard click (space or enter) ---
    document.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        balance += 0.1;
        updateBalanceDisplay();
      }
    });

    // --- Auto-save ---
    setInterval(() => {
      localStorage.setItem('delta_balance', balance.toFixed(6));
    }, 500);

    // --- TON Connect ---
    window.addEventListener('DOMContentLoaded', () => {
      const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://deltadevelopmenttelegram.github.io/tonconnect-manifest.json'
      });
      tonConnectUI.renderButton('#ton-connect');
    });
  </script>
</body>
</html>
